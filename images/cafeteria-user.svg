<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" aria-labelledby="title desc">
  <title id="title">食堂混雑状況の利用者向け画面イメージ</title>
  <desc id="desc">混雑状況、10分後と20分後の予測、今日のメニューをまとめた画面の再現図。</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#263629" stroke-width="1"/></pattern>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#72f58a"/><stop offset="1" stop-color="#38b86b"/></linearGradient>
  </defs>
  <rect width="760" height="460" rx="16" fill="#101510"/><rect width="760" height="460" rx="16" fill="url(#grid)"/>
  <rect x="20" y="18" width="720" height="38" rx="6" fill="#151e16" stroke="#36513a"/>
  <circle cx="39" cy="37" r="5" fill="#e98269"/><circle cx="57" cy="37" r="5" fill="#e3c66b"/><circle cx="75" cy="37" r="5" fill="url(#green)"/>
  <text x="96" y="41" fill="#b6c9b5" font-family="monospace" font-size="13">CAFETERIA / LIVE STATUS</text><text x="626" y="41" fill="#72f58a" font-family="monospace" font-size="12">SYSTEM READY</text>
  <text x="36" y="93" fill="#72f58a" font-family="monospace" font-size="13" letter-spacing="2">01 / PUBLIC VIEW</text>
  <text x="36" y="132" fill="#f1f5ef" font-family="sans-serif" font-size="28" font-weight="700">食堂混雑状況</text>
  <rect x="35" y="151" width="690" height="134" rx="10" fill="#151e16" stroke="#304432"/>
  <circle cx="102" cy="218" r="35" fill="#173b25"/><circle cx="102" cy="218" r="22" fill="url(#green)"/>
  <text x="158" y="204" fill="#72f58a" font-family="sans-serif" font-size="29" font-weight="700">空いている</text><text x="160" y="239" fill="#b6c9b5" font-family="sans-serif" font-size="17">現在 0人 / 利用率 0%</text>
  <rect x="482" y="181" width="210" height="14" rx="7" fill="#303c31"/><rect x="482" y="181" width="8" height="14" rx="7" fill="url(#green)"/>
  <text x="36" y="320" fill="#b6c9b5" font-family="monospace" font-size="12">FORECAST</text>
  <rect x="35" y="334" width="332" height="52" rx="7" fill="#151e16" stroke="#304432"/><text x="55" y="366" fill="#f1f5ef" font-family="sans-serif" font-size="16">10分後</text><circle cx="151" cy="360" r="6" fill="url(#green)"/><text x="166" y="366" fill="#72f58a" font-family="sans-serif" font-size="15">空いている</text>
  <rect x="393" y="334" width="332" height="52" rx="7" fill="#151e16" stroke="#304432"/><text x="413" y="366" fill="#f1f5ef" font-family="sans-serif" font-size="16">20分後</text><circle cx="509" cy="360" r="6" fill="url(#green)"/><text x="524" y="366" fill="#72f58a" font-family="sans-serif" font-size="15">空いている</text>
  <path d="M36 409h688" stroke="#304432"/><text x="36" y="438" fill="#72f58a" font-family="monospace" font-size="12">TODAY'S MENU</text><text x="204" y="438" fill="#c9d5c8" font-family="sans-serif" font-size="14">カレーライス　/　ラーメン　/　日替わり定食</text>
</svg>
