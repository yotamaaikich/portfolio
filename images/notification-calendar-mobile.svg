<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 760" role="img" aria-labelledby="title desc">
  <title id="title">Notification Calendar — compact mobile view</title>
  <desc id="desc">A compact mobile composition showing a monthly calendar, notification capture controls, and an empty saved-events panel.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#273229" stroke-width="1"/></pattern>
    <style>.mono{font-family:Consolas,'Courier New',monospace}.sans{font-family:'Segoe UI','Yu Gothic UI',sans-serif}.panel{fill:#1b241c;stroke:#344334;stroke-width:1}.cell{fill:#141b15;stroke:#344334;stroke-width:1}.muted{fill:#9bad9c}.bright{fill:#e5ede5}.green{fill:#72f58a}</style>
  </defs>
  <rect width="390" height="760" fill="#101510"/><rect width="390" height="760" fill="url(#grid)" opacity=".6"/>
  <g class="mono">
    <rect x="16" y="14" width="32" height="32" fill="#101510" stroke="#536953"/><rect x="25" y="23" width="14" height="14" fill="none" stroke="#72f58a" stroke-width="2"/><rect x="29" y="27" width="6" height="6" fill="#72f58a"/>
    <text x="57" y="27" class="bright" font-size="12" font-weight="700">NOTIFICATION CALENDAR</text><text x="57" y="40" class="muted" font-size="8" letter-spacing="1">PERSONAL PLANNER / LOCAL</text>
  </g>
  <circle cx="20" cy="61" r="3" class="green"/><text x="30" y="64" class="mono green" font-size="8" font-weight="700">NOTIFICATION LISTENER ACTIVE</text><text x="278" y="64" class="mono muted" font-size="8">LOCAL ONLY</text>
  <path d="M16 76H374" stroke="#344334"/>

  <rect class="panel" x="16" y="88" width="358" height="282"/>
  <text x="28" y="115" class="mono green" font-size="16" font-weight="700">2026年 12月</text>
  <rect x="262" y="98" width="100" height="26" fill="#141b15" stroke="#536953"/><text x="278" y="115" class="sans bright" font-size="10">すべて削除</text>
  <g class="sans" fill="#9bad9c" font-size="9" text-anchor="middle">
    <text x="41" y="144" fill="#d68073">日</text><text x="91" y="144">月</text><text x="141" y="144">火</text><text x="191" y="144">水</text><text x="241" y="144">木</text><text x="291" y="144">金</text><text x="341" y="144">土</text>
  </g>
  <g>
    <rect class="cell" x="18" y="153" width="48" height="32"/><rect class="cell" x="68" y="153" width="48" height="32"/><rect class="cell" x="118" y="153" width="48" height="32"/><rect class="cell" x="168" y="153" width="48" height="32"/><rect class="cell" x="218" y="153" width="48" height="32"/><rect class="cell" x="268" y="153" width="48" height="32"/><rect class="cell" x="318" y="153" width="54" height="32"/>
    <rect class="cell" x="18" y="185" width="48" height="32"/><rect class="cell" x="68" y="185" width="48" height="32"/><rect class="cell" x="118" y="185" width="48" height="32"/><rect class="cell" x="168" y="185" width="48" height="32"/><rect class="cell" x="218" y="185" width="48" height="32"/><rect class="cell" x="268" y="185" width="48" height="32"/><rect class="cell" x="318" y="185" width="54" height="32"/>
    <rect class="cell" x="18" y="217" width="48" height="32"/><rect class="cell" x="68" y="217" width="48" height="32"/><rect class="cell" x="118" y="217" width="48" height="32"/><rect class="cell" x="168" y="217" width="48" height="32"/><rect class="cell" x="218" y="217" width="48" height="32"/><rect class="cell" x="268" y="217" width="48" height="32"/><rect class="cell" x="318" y="217" width="54" height="32"/>
    <rect class="cell" x="18" y="249" width="48" height="32"/><rect class="cell" x="68" y="249" width="48" height="32"/><rect class="cell" x="118" y="249" width="48" height="32"/><rect class="cell" x="168" y="249" width="48" height="32"/><rect class="cell" x="218" y="249" width="48" height="32"/><rect class="cell" x="268" y="249" width="48" height="32"/><rect class="cell" x="318" y="249" width="54" height="32"/>
    <rect class="cell" x="18" y="281" width="48" height="32"/><rect class="cell" x="68" y="281" width="48" height="32"/><rect class="cell" x="118" y="281" width="48" height="32"/><rect class="cell" x="168" y="281" width="48" height="32"/><rect class="cell" x="218" y="281" width="48" height="32"/><rect class="cell" x="268" y="281" width="48" height="32"/><rect class="cell" x="318" y="281" width="54" height="32"/>
    <rect class="cell" x="18" y="313" width="48" height="32"/><rect class="cell" x="68" y="313" width="48" height="32"/><rect class="cell" x="118" y="313" width="48" height="32"/><rect class="cell" x="168" y="313" width="48" height="32"/><rect class="cell" x="218" y="313" width="48" height="32"/><rect class="cell" x="268" y="313" width="48" height="32"/><rect class="cell" x="318" y="313" width="54" height="32"/>
  </g>
  <g class="mono" font-size="9">
    <text x="23" y="166" fill="#d68073">29</text><text x="73" y="166" class="muted">30</text><text x="123" y="166" class="bright">1</text><text x="173" y="166" class="bright">2</text><text x="223" y="166" class="bright">3</text><text x="273" y="166" class="bright">4</text><text x="323" y="166" class="bright">5</text>
    <text x="23" y="198" fill="#d68073">6</text><text x="73" y="198" class="bright">7</text><text x="123" y="198" class="bright">8</text><text x="173" y="198" class="bright">9</text><text x="223" y="198" class="bright">10</text><text x="273" y="198" class="bright">11</text><text x="323" y="198" class="muted">12</text>
    <text x="23" y="230" fill="#d68073">13</text><text x="73" y="230" class="bright">14</text><text x="123" y="230" class="bright">15</text><text x="173" y="230" class="bright">16</text><text x="223" y="230" class="bright">17</text><text x="273" y="230" class="bright">18</text><text x="323" y="230" class="muted">19</text>
    <text x="23" y="262" fill="#d68073">20</text><text x="73" y="262" class="bright">21</text><text x="123" y="262" class="bright">22</text><text x="173" y="262" class="bright">23</text><text x="223" y="262" class="bright">24</text><text x="273" y="262" class="bright">25</text><text x="323" y="262" class="muted">26</text>
    <text x="23" y="294" fill="#d68073">27</text><text x="73" y="294" class="bright">28</text><text x="123" y="294" class="bright">29</text><text x="173" y="294" class="bright">30</text><text x="223" y="294" class="bright">31</text><text x="273" y="294" class="muted">1</text><text x="323" y="294" class="muted">2</text>
    <text x="23" y="326" fill="#d68073">3</text><text x="73" y="326" class="bright">4</text><text x="123" y="326" class="bright">5</text><text x="173" y="326" class="bright">6</text><text x="223" y="326" class="bright">7</text><text x="273" y="326" class="bright">8</text><text x="323" y="326" class="muted">9</text>
  </g>
  <text x="28" y="357" class="sans muted" font-size="9">予定は端末間で同期されます</text>

  <rect class="panel" x="16" y="382" width="358" height="203"/>
  <text x="28" y="408" class="sans green" font-size="12">›</text><text x="43" y="408" class="sans bright" font-size="12" font-weight="700">通知を予定候補にする</text>
  <text x="28" y="429" class="sans muted" font-size="9">通知を確認し、予定の内容を編集できます。</text>
  <rect x="28" y="441" width="157" height="21" fill="#141b15" stroke="#344334"/><text x="35" y="455" class="mono green" font-size="8" font-weight="700">TEAMS · WINDOWS</text>
  <rect x="193" y="441" width="169" height="21" fill="#141b15" stroke="#344334"/><text x="200" y="455" class="mono green" font-size="8" font-weight="700">ANDROID NOTIFICATIONS</text>
  <rect x="28" y="472" width="334" height="43" fill="#0c100d" stroke="#536953"/>
  <rect x="28" y="526" width="247" height="34" fill="#72f58a"/><text x="81" y="548" class="sans" fill="#101510" font-size="10" font-weight="700">候補をカレンダーに追加</text><rect x="283" y="526" width="79" height="34" fill="#141b15" stroke="#536953"/><text x="298" y="548" class="sans green" font-size="9">例を入力</text>

  <rect class="panel" x="16" y="597" width="358" height="137"/>
  <text x="28" y="624" class="sans bright" font-size="12" font-weight="700">›　登録した予定</text><path d="M28 636H362" stroke="#344334"/>
</svg>
