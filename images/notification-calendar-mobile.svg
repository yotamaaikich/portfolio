<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 1120" role="img" aria-labelledby="title desc">
  <title id="title">Notification Calendar — mobile layout</title>
  <desc id="desc">A narrow, vertically stacked view of the calendar, notification entry panel, and empty saved-events list.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#273229" stroke-width="1"/></pattern>
    <style>
      .mono{font-family:Consolas,'Courier New',monospace}.sans{font-family:'Segoe UI','Yu Gothic UI',sans-serif}
      .bg{fill:#101510}.panel{fill:#1b241c;stroke:#344334;stroke-width:1}.cell{fill:#141b15;stroke:#344334;stroke-width:1}
      .muted{fill:#9bad9c}.bright{fill:#e5ede5}.green{fill:#72f58a}.small{font-size:11px}.tiny{font-size:9px}
    </style>
  </defs>
  <rect class="bg" width="390" height="1120"/><rect width="390" height="1120" fill="url(#grid)" opacity=".65"/>
  <g class="mono">
    <rect x="16" y="16" width="34" height="34" fill="#101510" stroke="#536953"/><rect x="26" y="26" width="14" height="14" fill="none" stroke="#72f58a" stroke-width="2"/><rect x="30" y="30" width="6" height="6" fill="#72f58a"/>
    <text x="60" y="29" class="bright" font-size="12" font-weight="700" letter-spacing=".3">NOTIFICATION CALENDAR</text>
    <text x="60" y="43" class="muted" font-size="8" letter-spacing="1">PERSONAL PLANNER / LOCAL</text>
    <circle cx="21" cy="69" r="3" class="green"/><text x="31" y="73" class="green tiny" font-weight="700">NOTIFICATION LISTENER ACTIVE</text><text x="276" y="73" class="muted tiny">LOCAL ONLY</text>
  </g>
  <path d="M16 88H374" stroke="#344334"/>

  <rect class="panel" x="16" y="104" width="358" height="431" rx="2"/>
  <text x="28" y="133" class="mono green" font-size="17" font-weight="700">2026年 12月</text>
  <rect x="264" y="115" width="98" height="28" fill="#141b15" stroke="#536953"/><text x="278" y="133" class="sans bright" font-size="10">すべて削除</text>
  <g class="sans" font-size="10" text-anchor="middle">
    <text x="41" y="165" fill="#d68073">日</text><text x="91" y="165" class="muted">月</text><text x="141" y="165" class="muted">火</text><text x="191" y="165" class="muted">水</text><text x="241" y="165" class="muted">木</text><text x="291" y="165" class="muted">金</text><text x="341" y="165" class="muted">土</text>
  </g>
  <g>
    $150" height="55"/>$150" height="55"/>$150" height="55"/>$150" height="55"/>$150" height="55"/>$150" height="55"/><rect class="cell" x="316" y="176" width="50" height="55"/>
    $150" height="55"/>$150" height="55"/>$150" height="55"/>$150" height="55"/>$150" height="55"/>$150" height="55"/><rect class="cell" x="316" y="231" width="50" height="55"/>
    $150" height="55"/>$150" height="55"/>$150" height="55"/>$150" height="55"/>$150" height="55"/>$150" height="55"/><rect class="cell" x="316" y="286" width="50" height="55"/>
    $150" height="55"/>$150" height="55"/>$150" height="55"/>$150" height="55"/>$150" height="55"/>$150" height="55"/><rect class="cell" x="316" y="341" width="50" height="55"/>
    $150" height="55"/>$150" height="55"/>$150" height="55"/>$150" height="55"/>$150" height="55"/>$150" height="55"/><rect class="cell" x="316" y="396" width="50" height="55"/>
    $150" height="55"/>$150" height="55"/>$150" height="55"/>$150" height="55"/>$150" height="55"/>$150" height="55"/><rect class="cell" x="316" y="451" width="50" height="55"/>
  </g>
  <g class="mono tiny">
    <text x="21" y="193" fill="#d68073">29</text><text x="71" y="193" class="muted">30</text><text x="121" y="193" class="bright">1</text><text x="171" y="193" class="bright">2</text><text x="221" y="193" class="bright">3</text><text x="271" y="193" class="bright">4</text><text x="321" y="193" class="bright">5</text>
    <text x="21" y="248" fill="#d68073">6</text><text x="71" y="248" class="bright">7</text><text x="121" y="248" class="bright">8</text><text x="171" y="248" class="bright">9</text><text x="221" y="248" class="bright">10</text><text x="271" y="248" class="bright">11</text><text x="321" y="248" class="muted">12</text>
    <text x="21" y="303" fill="#d68073">13</text><text x="71" y="303" class="bright">14</text><text x="121" y="303" class="bright">15</text><text x="171" y="303" class="bright">16</text><text x="221" y="303" class="bright">17</text><text x="271" y="303" class="bright">18</text><text x="321" y="303" class="muted">19</text>
    <text x="21" y="358" fill="#d68073">20</text><text x="71" y="358" class="bright">21</text><text x="121" y="358" class="bright">22</text><text x="171" y="358" class="bright">23</text><text x="221" y="358" class="bright">24</text><text x="271" y="358" class="bright">25</text><text x="321" y="358" class="muted">26</text>
    <text x="21" y="413" fill="#d68073">27</text><text x="71" y="413" class="bright">28</text><text x="121" y="413" class="bright">29</text><text x="171" y="413" class="bright">30</text><text x="221" y="413" class="bright">31</text><text x="271" y="413" class="muted">1</text><text x="321" y="413" class="muted">2</text>
    <text x="21" y="468" fill="#d68073">3</text><text x="71" y="468" class="bright">4</text><text x="121" y="468" class="bright">5</text><text x="171" y="468" class="bright">6</text><text x="221" y="468" class="bright">7</text><text x="271" y="468" class="bright">8</text><text x="321" y="468" class="muted">9</text>
  </g>
  <text x="28" y="523" class="sans muted" font-size="9">予定はこのPCに保存されます</text>

  <rect class="panel" x="16" y="551" width="358" height="306" rx="2"/>
  <text x="28" y="579" class="sans green" font-size="13">›</text><text x="41" y="579" class="sans bright" font-size="13" font-weight="700">通知を予定にする</text>
  <text x="28" y="603" class="sans muted" font-size="10">TeamsやChromeの通知文を読み取り、</text><text x="28" y="619" class="sans muted" font-size="10">予定の候補を作成します。</text>
  <rect x="28" y="636" width="156" height="22" fill="#141b15" stroke="#344334"/><text x="35" y="651" class="mono green" font-size="8" font-weight="700">TEAMS · WINDOWS</text>
  <rect x="192" y="636" width="170" height="22" fill="#141b15" stroke="#344334"/><text x="199" y="651" class="mono green" font-size="8" font-weight="700">GMAIL · CHROME</text>
  <rect x="28" y="668" width="334" height="62" fill="#0c100d" stroke="#536953"/>
  <rect x="28" y="742" width="250" height="36" fill="#72f58a"/><text x="78" y="765" class="sans" fill="#101510" font-size="11" font-weight="700">文章から候補を作成</text>
  <rect x="286" y="742" width="76" height="36" fill="#141b15" stroke="#536953"/><text x="300" y="765" class="sans green" font-size="10">例を入力</text>
  <text x="28" y="800" class="sans muted" font-size="9">候補は確認してから登録できます</text>
  <rect x="28" y="811" width="334" height="32" fill="#141b15" stroke="#344334"/>

  <rect class="panel" x="16" y="873" width="358" height="221" rx="2"/>
  <text x="28" y="903" class="sans bright" font-size="13" font-weight="700">›　登録した予定</text><path d="M28 916H362" stroke="#344334"/>
</svg>
