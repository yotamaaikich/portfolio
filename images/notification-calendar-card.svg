  <g>
    <rect x="390" y="42" width="776" height="316" fill="#1b241c" stroke="#344334"/>
    <text x="424" y="86" class="sans green" font-size="14">›</text><text x="447" y="86" class="sans bright" font-size="20" font-weight="700">通知から予定候補を作成</text>
