    <rect x="58" y="189" width="36" height="35"/><rect x="96" y="189" width="36" height="35"/><rect x="134" y="189" width="36" height="35"/><rect x="172" y="189" width="36" height="35"/><rect x="210" y="189" width="36" height="35"/><rect x="248" y="189" width="36" height="35"/><rect x="286" y="189" width="36" height="35"/>
    <rect x="58" y="226" width="36" height="35"/><rect x="96" y="226" width="36" height="35"/><rect x="134" y="226" width="36" height="35"/><rect x="172" y="226" width="36" height="35"/><rect x="210" y="226" width="36" height="35"/><rect x="248" y="226" width="36" height="35"/><rect x="286" y="226" width="36" height="35"/>
