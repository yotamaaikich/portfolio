    <style>.mono{font-family:Consolas,'Courier New',monospace}.sans{font-family:'Segoe UI','Yu Gothic UI',sans-serif}.muted{fill:#91a393}.bright{fill:#e5ede5}.green{fill:#72f58a}.line{stroke:#344334}</style>
  </defs>
