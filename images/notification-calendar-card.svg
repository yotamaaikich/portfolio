<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Notification Calendar</title>
  <desc id="desc">A compact preview of the notification calendar with a monthly calendar and event capture panel.</desc>
  <defs>
